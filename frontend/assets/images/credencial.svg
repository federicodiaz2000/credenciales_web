<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE29F"/>
      <stop offset="100%" stop-color="#FFA99F"/>
    </linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#g2)" rx="160"/>

  <g transform="translate(256,256)">
    <!-- Escudo -->
    <path d="M256 0 L384 80 C384 240 256 320 256 320 C256 320 128 240 128 80 L256 0 Z" fill="#FFFFFF" stroke="#FFD6A6" stroke-width="6" filter="url(#sh2)"/>

    <!-- Candado -->
    <g transform="translate(176,120)">
      <rect x="48" y="120" width="160" height="120" rx="12" fill="#2B2F42"/>
      <rect x="100" y="40" width="80" height="80" rx="40" fill="#2B2F42"/>
      <path d="M140 40 A40 40 0 0 1 220 40" fill="none" stroke="#FFFFFF" stroke-width="12"/>

      <!-- Ojal del candado (llave) -->
      <circle cx="128" cy="180" r="14" fill="#FFFFFF"/>
      <rect x="124" y="190" width="8" height="36" rx="4" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Texto principal cerca del borde inferior -->
  <text x="512" y="940" text-anchor="middle" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="64" font-weight="700" fill="#2B2F42">Credenciales</text>

</svg>
